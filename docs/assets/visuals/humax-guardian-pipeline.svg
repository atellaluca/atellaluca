<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">HumaxGuardian architecture pipeline</title>
  <desc id="desc">Diagram showing target SPI and MBoot, UART trust boundary enforced by ESP32 Guardian, and host/offline analysis flow.</desc>
  <style>
    .bg { fill: none; }
    .box { fill: #ffffff; stroke: #152c32; stroke-width:1.8; rx:8; }
    .sub { fill:#f6f8f7; stroke:#cfdcd6; }
    .text { font-family: Inter, Arial, sans-serif; font-size:14px; fill:#152c32; }
    .muted { fill:#53656a; font-size:12px; }
    .boundary { stroke:#11685e; stroke-dasharray:6 6; stroke-width:2; fill:none; }
    .arrow { stroke:#152c32; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#152c32" />
    </marker>
  </defs>

  <!-- Target side -->
  <g transform="translate(40,30)">
    <rect class="box" width="220" height="120" />
    <text x="14" y="26" class="text" font-weight="700">Target</text>
    <text x="14" y="50" class="text">SPI NOR (8 MiB)</text>
    <text x="14" y="70" class="muted">MBoot / Bootloader</text>
    <text x="14" y="92" class="muted">DRAM primitives</text>
  </g>

  <!-- UART connection -->
  <path class="arrow" d="M260 90 L360 90" />
  <text x="300" y="80" class="muted">UART</text>

  <!-- Boundary and ESP32 guardian -->
  <g transform="translate(360,10)">
    <rect x="0" y="20" width="320" height="160" class="sub" />
    <rect x="6" y="26" width="308" height="64" class="box" />
    <text x="16" y="48" class="text" font-weight="700">ESP32 Guardian</text>
    <text x="16" y="68" class="muted">timing · allowlist · power control · logging</text>

    <rect x="6" y="100" width="308" height="56" class="box" />
    <text x="16" y="124" class="text" font-weight="700">Policy Boundary</text>
    <text x="16" y="144" class="muted">deny-by-default · local fail-safe</text>
  </g>

  <rect x="352" y="6" width="336" height="192" class="boundary" />

  <!-- Host side -->
  <path class="arrow" d="M700 90 L820 90" />
  <g transform="translate(820,30)">
    <rect class="box" width="160" height="120" />
    <text x="12" y="36" class="text" font-weight="700">Host</text>
    <text x="12" y="60" class="muted">Python client · logging</text>
    <text x="12" y="84" class="muted">USB storage (fatwrite)</text>
  </g>

  <!-- Offline analysis -->
  <path class="arrow" d="M900 160 L900 220" />
  <g transform="translate(760,230)">
    <rect class="box" width="260" height="120" />
    <text x="16" y="42" class="text" font-weight="700">Offline analysis</text>
    <text x="16" y="68" class="muted">CRC32 · SHA‑256 · LZMA decompression · binary analysis</text>
  </g>

  <!-- Legend / trust annotations -->
  <text x="30" y="380" class="muted">Trust boundary: ESP32 enforces policy between host and target.</text>
  <text x="30" y="400" class="muted">Important: target SPI remained unmodified during acquisition (Verified).</text>

</svg>
