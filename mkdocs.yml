site_name: "Luca Atella · Software Architect & Backend Platform Engineer"
site_description: "Luca Atella portfolio: software architect and backend platform engineer focused on AWS, FastAPI, cloud-portable backend architecture, runtime contract validation, IoT and Digital Twin systems."
site_author: "Luca Atella"
site_url: "https://profile.atellaluca.com/"

hooks:
  - hooks/seo.py

theme:
  name: material
  custom_dir: overrides
  logo: assets/luca-atella-software-architect-backend-platform-engineer.png
  favicon: assets/favicon.ico
  language: en
  palette:
    - scheme: default
      primary: grey
      accent: amber
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - navigation.footer

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: it
          name: Italiano
          build: true
          site_name: "Luca Atella · Software Architect & Backend Platform Engineer"
          site_description: "Portfolio di Luca Atella: software architect e backend platform engineer lucano, focalizzato su AWS, FastAPI, architetture backend cloud-portable, runtime contract validation, IoT e Digital Twin."
          nav_translations:
            Home: Home
            About: Chi sono
            Methodology: Metodo
            Case Studies: Casi Studio
            Overview: Panoramica
            Cloud-Portable Fleet Management Platform: Piattaforma Fleet Cloud-Portable
            Architecture: Architettura
            Validation System (Deep Dive): Sistema di Validazione
            Runtime Contracts (Deep Dive): Runtime Contracts
            Violation System and Contract Diagnostics (Deep Dive): Diagnostica Contratti
            Unified Backend for Heterogeneous Data Sources (SAFE): Backend Unificato per Sorgenti Eterogenee
            Plugin System (Deep Dive): Sistema Plugin
            Declarative UI Schema (Widget DSL): Schema UI Dichiarativo
            Operations & DX: Operations e Developer Experience
            IoT Data Aggregation Architecture for Digital Twin Systems: Architettura IoT per Digital Twin
            End-to-End Real-Time Fleet Telemetry Backend (SAFE): Backend Telemetria Fleet Real-Time
            Profile: Profilo
            CV: CV
            Contact: Contatti

markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed

extra_css:
  - stylesheets/cv-pdf.css
  - stylesheets/print.css
  - stylesheets/header.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - About: about.md
  - Methodology: methodology.md

  - Case Studies:
      - Overview: case-studies/index.md
      - Cloud-Portable Fleet Management Platform:
          - Overview: case-studies/cloud-portable-fleet-platform/index.md
      - ImportSpy:
          - Overview: case-studies/importspy/index.md
          - Architecture: case-studies/importspy/architecture.md
          - Validation System (Deep Dive): case-studies/importspy/validation.md
          - Runtime Contracts (Deep Dive): case-studies/importspy/contracts.md
          - Violation System and Contract Diagnostics (Deep Dive): case-studies/importspy/violations.md

      - B3DO:
          - Overview: case-studies/b3do/index.md

      - Unified Backend for Heterogeneous Data Sources (SAFE):
          - Overview: case-studies/unified-backend/index.md
          - Architecture: case-studies/unified-backend/architecture.md
          - Plugin System (Deep Dive): case-studies/unified-backend/plugin-system.md
          - Declarative UI Schema (Widget DSL): case-studies/unified-backend/ui-schema.md
          - Operations & DX: case-studies/unified-backend/operations.md

      - IoT Data Aggregation Architecture for Digital Twin Systems:
          - Overview: case-studies/iot-data-aggregation-digital-twin/index.md

      - End-to-End Real-Time Fleet Telemetry Backend (SAFE):
          - Overview: case-studies/fleet-tracking/index.md
          - Architecture: case-studies/fleet-tracking/architecture.md

  - Profile: profile.md
  - CV: cv.md
  - Contact: contact.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/atellaluca
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/luca-atella/
